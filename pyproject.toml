[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiops-agent"
version = "0.1.0"
description = "AI-powered IT Operations agent for monitoring, incident detection, RCA, and remediation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AIOps Agent Contributors" }]
dependencies = [
    "anthropic>=0.88.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "structlog>=24.1",
    "typer>=0.12",
    "tenacity>=8.3",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[project.scripts]
aiops-agent = "aiops_agent.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_agent"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ANN", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring live credentials (deselect with '-m \"not integration\"')",
]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["src/aiops_agent"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
